name: GAIO
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 8 * * 1-5'
      timezone: America/Costa_Rica
    - cron: '0 17 * * 1-5'
      timezone: America/Costa_Rica
  workflow_dispatch:
    inputs:
      action:
        description: Acción
        type: choice
        options: [inspect, check-in, check-out]
        default: inspect
        required: true
      confirm:
        description: Confirmo ejecutar la marcación elegida
        type: boolean
        default: false
        required: true
permissions:
  contents: read
concurrency:
  group: gaio-attendance
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
  gaio:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Ejecutar acción solicitada
        env:
          GAIO_SESSION: ${{ secrets.GAIO_SESSION }}
          GAIO_EMAIL: ${{ secrets.GAIO_EMAIL }}
          GAIO_PASSWORD: ${{ secrets.GAIO_PASSWORD }}
          GAIO_CRON: ${{ github.event.schedule }}
          GAIO_ACTION: ${{ inputs.action }}
          CONFIRM_ACTION: ${{ inputs.confirm }}
        run: node scripts/run.mjs "$GAIO_ACTION"
