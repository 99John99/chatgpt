name: GAIO
on:
  workflow_dispatch:
    inputs:
      action:
        description: Acción
        type: choice
        options: [inspect, check-in, check-out]
        default: inspect
        required: true
      confirm:
        description: Confirmo ejecutar la marcación elegida
        type: boolean
        default: false
        required: true
permissions:
  contents: read
concurrency:
  group: gaio-attendance
  cancel-in-progress: false
jobs:
  gaio:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Ejecutar acción solicitada
        env:
          GAIO_SESSION: ${{ secrets.GAIO_SESSION }}
          GAIO_ACTION: ${{ inputs.action }}
          CONFIRM_ACTION: ${{ inputs.confirm }}
        run: node scripts/run.mjs "$GAIO_ACTION"
