name: GAIO access test
on:
  push:
    branches: [codex/gaio-access-test]
    paths: [.github/workflows/gaio.yml]
permissions:
  contents: read
concurrency:
  group: gaio-attendance
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Comprobar acceso sin marcar asistencia
        env:
          GAIO_SESSION: ${{ secrets.GAIO_SESSION }}
          GAIO_EMAIL: ${{ secrets.GAIO_EMAIL }}
          GAIO_PASSWORD: ${{ secrets.GAIO_PASSWORD }}
          CONFIRM_ACTION: 'false'
        run: node scripts/run.mjs inspect
